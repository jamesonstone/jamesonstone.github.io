name: Update projects page

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-projects
  cancel-in-progress: false

jobs:
  validate:
    name: Validate site and updater
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Run regression tests and validate site
        run: |
          ruby -c scripts/update_projects_from_github.rb
          ruby -c scripts/validate_site.rb
          ruby scripts/update_projects_from_github_test.rb
          ruby scripts/update_projects_workflow_test.rb
          ruby scripts/validate_site_test.rb
          bundle exec jekyll build
          ruby scripts/validate_site.rb

  update-projects:
    name: Check GitHub repositories
    runs-on: ubuntu-latest
    if: github.repository == 'jamesonstone/jamesonstone.github.io' && github.event_name != 'pull_request'

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler: latest
          bundler-cache: true

      - name: Check out or create projects update branch
        env:
          UPDATE_BRANCH: automation/update-projects
        run: |
          set -euo pipefail

          git config user.name "Jameson Stone"
          git config user.email "jameson@stone.tc"
          if git show-ref --verify --quiet "refs/remotes/origin/$UPDATE_BRANCH"; then
            git switch --create "$UPDATE_BRANCH" --track "origin/$UPDATE_BRANCH"
            git merge --no-edit "$GITHUB_SHA"
          else
            git switch --create "$UPDATE_BRANCH" "$GITHUB_SHA"
          fi

      - name: Update projects page from GitHub repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ruby scripts/update_projects_from_github.rb

      - name: Detect projects page changes
        id: changes
        run: |
          if git diff --quiet -- projects.md llms.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated site
        if: steps.changes.outputs.changed == 'true'
        run: |
          bundle exec jekyll build
          ruby scripts/validate_site.rb

      - name: Create or update projects page pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: automation/update-projects
        run: |
          set -euo pipefail

          if git diff --quiet -- projects.md llms.txt; then
            echo "No new changes to commit."
            exit 0
          fi

          git add projects.md llms.txt
          git commit -m "docs: update projects page from GitHub repositories"
          git push -u origin "$UPDATE_BRANCH"

          cat > /tmp/update-projects-pr.md <<'BODY'
          ## Description

          - :memo: Adds newly discovered public repositories and repairs missing project index links.
          - :wrench: Keeps the Projects page and LLM index synchronized using maintained descriptions and GitHub metadata.

          ## How to Test

          1. `bundle exec jekyll build`
          2. `ruby scripts/validate_site.rb`

          ## Ticket

          Automated follow-up from the projects page updater workflow.
          BODY

          if gh pr view "$UPDATE_BRANCH" >/dev/null 2>&1; then
            gh pr edit "$UPDATE_BRANCH" \
              --title ":memo: Update projects page from GitHub repositories" \
              --body-file /tmp/update-projects-pr.md \
              --add-assignee jamesonstone
          else
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title ":memo: Update projects page from GitHub repositories" \
              --body-file /tmp/update-projects-pr.md \
              --assignee jamesonstone
          fi
